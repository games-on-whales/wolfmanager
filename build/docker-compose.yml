version: "3.8"

services:
  wolf-admin:
    build:
      context: ..
      dockerfile: build/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # NEXTAUTH_SECRET and ENCRYPTION_KEY will be auto-generated if not provided
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DATABASE_TYPE=sqlite
      # For PostgreSQL: DATABASE_TYPE=postgresql
      # For PostgreSQL: DATABASE_URL=postgresql://username:password@postgres:5432/wolfmanager
    volumes:
      - /var/run/wolf/wolf.sock:/var/run/wolf/wolf.sock
      - wolf-config:/app/config
      - wolf-data:/app/data
    restart: unless-stopped
    depends_on:
      - wolf

volumes:
  wolf-config:
    driver: local
  wolf-data:
    driver: local
