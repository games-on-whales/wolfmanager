name: Docker Build

on:
  push:
    branches: [ stable ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'current'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Changed from 'read' to 'write' to allow tag creation
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags
          fetch-tags: true  # Explicitly fetch all tags
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Generate version tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "stable" ]]; then
            # For stable branch, use YYYYMM.### format
            YEAR=$(date +%Y)
            MONTH=$(date +%m)
            BASE_VERSION="${YEAR}${MONTH}"
            
            echo "Generating version for base: ${BASE_VERSION}"
            
            # Ensure we have all remote tags
            git fetch --tags origin
            
            # Get existing tags for this month to determine next increment
            EXISTING_TAGS=$(git tag -l "${BASE_VERSION}.*" | sort -V | tail -1)
            
            if [[ -z "$EXISTING_TAGS" ]]; then
              # No existing tags for this month, start with .001
              INCREMENT="001"
              echo "No existing tags found, starting with increment: ${INCREMENT}"
            else
              # Extract the increment number and add 1
              LAST_INCREMENT=$(echo "$EXISTING_TAGS" | sed "s/${BASE_VERSION}\.//")
              INCREMENT=$(printf "%03d" $((10#$LAST_INCREMENT + 1)))
              echo "Found existing tag: ${EXISTING_TAGS}, next increment: ${INCREMENT}"
            fi
            
            VERSION_TAG="${BASE_VERSION}.${INCREMENT}"
            echo "Generated version tag: ${VERSION_TAG}"
            
            # Check if this tag already exists (safety check)
            if git tag -l | grep -q "^${VERSION_TAG}$"; then
              echo "ERROR: Tag ${VERSION_TAG} already exists locally!"
              exit 1
            fi
            
            # Check if tag exists on remote
            if git ls-remote --tags origin | grep -q "refs/tags/${VERSION_TAG}$"; then
              echo "ERROR: Tag ${VERSION_TAG} already exists on remote!"
              exit 1
            fi
            
            echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            # For non-stable branches, use branch name as tag
            BRANCH_NAME="${{ github.ref_name }}"
            # Replace invalid Docker tag characters
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
            echo "tag=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create and push version tag
        if: steps.version.outputs.is_stable == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.version.outputs.tag }}"
          echo "Creating and pushing tag: ${TAG}"
          
          # Final safety check before creating tag
          if git tag -l | grep -q "^${TAG}$"; then
            echo "ERROR: Tag ${TAG} already exists locally, cannot create!"
            exit 1
          fi
          
          # Create and push the tag
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Successfully created and pushed tag: ${TAG}"
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/wolfmanager
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=WolfManager
            org.opencontainers.image.description=Wolf Manager Production Docker Image
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_ENV=production
